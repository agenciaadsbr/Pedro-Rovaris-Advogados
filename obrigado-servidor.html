<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recebemos seu contato | Pedro Rovaris Advogados Associados</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1320">
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Hanken+Grotesk:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#0B1320;color:#FFFFFF;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:17px;line-height:1.6}
header{padding:20px 24px;border-bottom:1px solid rgba(198,163,106,.18)}
header img{height:36px;width:auto;display:block}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{width:100%;max-width:560px;background:#FFFFFF;color:#0F1C2E;border-radius:16px;padding:clamp(28px,5vw,48px);display:flex;flex-direction:column;gap:18px;align-items:flex-start;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.ok{width:56px;height:56px;border-radius:999px;background:#E3F3E8;display:flex;align-items:center;justify-content:center}
h1{margin:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(24px,4vw,30px);line-height:1.2;text-transform:uppercase}
p{margin:0;color:#4B5768}
strong{color:#15803D}
.bar{width:100%;height:4px;background:#E6EAE3;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:#15803D;transition:width 1s linear}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:58px;padding:0 28px;border-radius:10px;background:#15803D;color:#FFFFFF;text-decoration:none;font-family:Montserrat,sans-serif;font-weight:700;transition:background-color .2s}
.btn:hover{background:#106B33}
.btn:focus-visible{outline:3px solid #C6A36A;outline-offset:2px}
small{color:#5A6575;font-size:13px}
@media (max-width:600px){.card{align-items:center;text-align:center}}
</style>
<script src="config.js"></script>
<script src="tracking.js"></script>
</head>
<body>
<header><a href="/servidor"><img src="assets/logo.webp" alt="Pedro Rovaris Advogados Associados" width="640" height="117"></a></header>
<main>
<div class="card" role="status">
<span class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<h1 id="t">Recebemos suas informações.</h1>
<p>Você será direcionado ao WhatsApp do escritório em <strong><span id="n">3</span>s</strong>.</p>
<div class="bar" aria-hidden="true"><span id="bar"></span></div>
<a id="wa" class="btn" href="#" rel="noopener">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.79-1.47-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.75-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.9-9.88 2.64 0 5.12 1.03 6.99 2.9a9.82 9.82 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.89 9.88zm8.41-18.3A11.81 11.81 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.16-3.48-8.41z"></path></svg>
Ir agora para o WhatsApp
</a>
<small>Conteúdo informativo, conforme o Provimento nº 205/2021 do CFOAB.</small>
</div>
</main>
<script>
(function () {
  var C = window.PR_CONFIG, track = window.prTrack || function () {};
  var lead = {};
  try { lead = JSON.parse(sessionStorage.getItem('pr_lead') || '{}'); } catch (e) {}
  lead.area = 'servidor';
  if (lead.nome) document.getElementById('t').textContent = 'Recebemos suas informações, ' + lead.nome + '.';
  var assunto = lead.area === 'familia' ? ' sobre Direito de Família (pensão alimentícia / abandono afetivo)'
    : lead.area === 'servidor' ? ' sobre FGTS / contrato temporário (ACT)' : '';
  var msg = 'Olá!' + (lead.nome ? ' Meu nome é ' + lead.nome + '.' : '') + ' Preenchi o formulário no site' + assunto + '.';
  var url = 'https://wa.me/' + C.WHATSAPP + '?text=' + encodeURIComponent(msg);
  var a = document.getElementById('wa');
  a.href = url;
  a.addEventListener('click', function () { track('whatsapp_click', { position: 'obrigado_botao', lead_area: lead.area || 'geral' }); });

  track('page_obrigado', { lead_area: lead.area || 'geral' });

  var n = 3, el = document.getElementById('n'), bar = document.getElementById('bar');
  requestAnimationFrame(function () { bar.style.width = '33%'; });
  var timer = setInterval(function () {
    n -= 1;
    el.textContent = Math.max(n, 0);
    bar.style.width = Math.round(((3 - n) / 3) * 100) + '%';
    if (n <= 0) {
      clearInterval(timer);
      track('whatsapp_click', { position: 'redirect_automatico', lead_area: lead.area || 'geral' });
      setTimeout(function () { location.href = url; }, 250);
    }
  }, 1000);
})();
</script>
</body>
</html>
